name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the suite needs no GPU, and the CUDA wheel is
          # several GB of download per job.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e '.[dev]'

      - name: Run tests
        # No network access in CI: the PubMed fetchers are driven with a fake
        # aiohttp session and the evidence searcher is dependency-overridden.
        run: python -m pytest -q --cov=src --cov-report=term-missing

      - name: Fail if any known defect was silently fixed
        # known_defect tests are xfail(strict), so a fixed bug turns into a
        # hard failure -- the signal to drop the marker. This step makes that
        # visible as its own line rather than buried in the run above.
        run: python -m pytest -m known_defect -q
