version: '3.8'

services:
  neo4j:
    image: neo4j:5.11-community
    container_name: medical-evidence-graph-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_security_auth__minimum__password__length=8
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    container_name: medical-evidence-graph-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    # Matched to the qdrant-client major/minor in pyproject.toml. The
    # client refuses a mismatch wider than one minor version, and the
    # v1.5.0 pin here predated the client API this service uses.
    image: qdrant/qdrant:v1.19.0
    container_name: medical-evidence-graph-qdrant
    # Host ports 6343/6344, not the Qdrant defaults: 6333/6334 are commonly
    # already taken by another Qdrant on a developer machine, and binding
    # over it would either fail to start or point this project at someone
    # else's collections. The container still listens on 6333 internally.
    ports:
      - "6343:6333"
      - "6344:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships neither wget nor curl, and /health became /healthz,
      # so the previous check could never pass -- a working Qdrant reported
      # itself unhealthy. bash is present; this opens a TCP connection to
      # the internal port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  opensearch_data:
  qdrant_data: